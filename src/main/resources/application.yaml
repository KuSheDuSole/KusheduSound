spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: KusheduSound
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

app:
  storage:
    tracks-path: ./storage/tracks
  base-admin:
    email: ${BASE_ADMIN_EMAIL}
    password: ${BASE_ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 900000 # 15 минут
    refresh-expiration-ms: 86400000 # 24 часа     # 7 дней - 604800000
  playlist:
    expiration-h: 24